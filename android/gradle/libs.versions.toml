[versions]
agp = "8.13.2"
kotlin = "2.2.21"
ksp = "2.2.21-2.0.4"
compose = "2025.10.00"
room = "2.8.4"
coroutines = "1.10.2"
lifecycle = "2.9.4"
glance = "1.1.1"
media3 = "1.11.1"

[libraries]
google-auth = { module = "com.google.android.gms:play-services-auth", version = "22.0.0" }
litertlm = { module = "com.google.ai.edge.litertlm:litertlm-android", version = "0.12.0" }
ocr = { module = "com.google.mlkit:text-recognition", version = "16.0.1" }
image-labeling = { module = "com.google.mlkit:image-labeling", version = "17.0.9" }
mediapipe-text = { module = "com.google.mediapipe:tasks-text", version = "0.10.26" }
onnxruntime = { module = "com.microsoft.onnxruntime:onnxruntime-android", version = "1.31.1" }
sqlcipher = { module = "net.zetetic:sqlcipher-android", version = "4.20.0" }
android-mail = { module = "com.sun.mail:android-mail", version = "1.6.8" }
android-activation = { module = "com.sun.mail:android-activation", version = "1.6.8" }
work-runtime = { module = "androidx.work:work-runtime-ktx", version = "2.10.5" }
core = { module = "androidx.core:core", version = "1.15.0" }
activity-compose = { module = "androidx.activity:activity-compose", version = "1.11.0" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }
glance-material3 = { module = "androidx.glance:glance-material3", version.ref = "glance" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
