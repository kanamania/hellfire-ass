# HellFire web access — local site (https://hellfire.local). Install:
#   sudo cp web/nginx/hellfire.local.conf /etc/nginx/sites-available/hellfire.local.conf
#   sudo ln -s /etc/nginx/sites-available/hellfire.local.conf /etc/nginx/sites-enabled/
#   echo "127.0.0.1 hellfire.local" | sudo tee -a /etc/hosts && sudo nginx -t && sudo systemctl reload nginx
# Certificate: self-signed, /etc/nginx/ssl/hellfire.local.{crt,key} (see README → Web access).
# The website (127.0.0.1:3910) is on 443; it forwards the phone's /api/sync/* to the API itself.
# The relays are on 8443 (WhatsApp, 127.0.0.1:8080) and 8444 (Telegram, 127.0.0.1:8081), same certificate;
# commented out below until the relays run here. Set the phone's relay URL to https://hellfire.local:8443 (and :8444). Remove a block you don't run.
# nginx listens on all interfaces so the phone can reach it over the LAN; firewall other networks.
server {
    listen 80;
    listen [::]:80;
    server_name hellfire.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hellfire.local;

    ssl_certificate     /etc/nginx/ssl/hellfire.local.crt;
    ssl_certificate_key /etc/nginx/ssl/hellfire.local.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=15552000" always;

    access_log /var/log/nginx/hellfire.local-access.log;
    error_log  /var/log/nginx/hellfire.local-error.log;

    charset utf-8;
    # Phone sync batches are capped at about 1 MB; the API accepts up to 4 MB.
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:3910;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}


