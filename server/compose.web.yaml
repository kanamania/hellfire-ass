services:
  relay:
    environment:
      WHATSAPP_TRANSPORT: web
      WHATSAPP_WEB_STATE_DIR: /app/web-state
    volumes:
      - whatsapp-web-spool:/app/web-state
  whatsapp-web:
    build: ./whatsapp-web
    restart: unless-stopped
    init: true
    environment:
      STORE_KEY_BASE64: ${STORE_KEY_BASE64:?Set STORE_KEY_BASE64 in the private .env}
      WHATSAPP_WEB_STATE_DIR: /app/web-state
      WHATSAPP_WEB_SESSION_DIR: /app/web-session
    volumes:
      - whatsapp-web-spool:/app/web-state
      - whatsapp-web-session:/app/web-session
    shm_size: 512mb
    # Required by Puppeteer's documented Docker setup to run Chromium's sandbox.
    cap_add:
      - SYS_ADMIN
volumes:
  whatsapp-web-spool:
  whatsapp-web-session:
