services:
  relay:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - relay-data:/app/state
      - ./device-public.pem:/app/device-public.pem:ro
    environment:
      DEVICE_PUBLIC_KEY_FILE: /app/device-public.pem
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  relay-data:
